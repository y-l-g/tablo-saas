# Development services. `docker compose up -d`, then `cargo run`.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
      POSTGRES_DB: saas
    ports:
      - "5433:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas"]
      interval: 2s
      timeout: 3s
      retries: 20
  # Answers like Stripe and refuses what Stripe would: `STRIPE_MOCK_URL=http://127.0.0.1:12111`.
  stripe-mock:
    image: stripe/stripe-mock:latest
    ports:
      - "12111:12111"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  postgres:
