[package]
name = "tablo-saas"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
description = "A production SaaS template built on Tablo, Topcoat and Toasty, with Stripe billing."
default-run = "tablo-saas"

[[bin]]
name = "tablo-saas"
path = "src/main.rs"

# Generates migrations from the models. A development tool: the server applies the embedded
# migrations itself, so `toasty-cli` stays out of the production binary.
[[bin]]
name = "toasty"
path = "src/bin/toasty.rs"
required-features = ["toasty-cli"]

[features]
toasty-cli = ["dep:toasty-cli"]

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
hex = "0.4"
hmac = "0.12"
jiff = { version = "0.2", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "http2", "json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
tablo = { git = "https://github.com/y-l-g/tablo.git", rev = "259959397", features = ["sqlite", "postgresql"] }
thiserror = "2"
toasty = { version = "0.11", features = ["jiff", "migration", "postgresql", "serde", "sqlite"] }
toasty-cli = { version = "0.11", optional = true }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal", "time"] }
topcoat = { version = "0.12", features = ["asset", "font", "font-fontsource", "l10n-fluent", "mail", "mail-smtp", "multipart", "runtime", "serve", "tailwind"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.23", features = ["serde", "v4", "v7"] }

[dev-dependencies]
http = "1"
tablo = { git = "https://github.com/y-l-g/tablo.git", rev = "259959397", features = ["testing"] }

[build-dependencies]
tablo-build = { git = "https://github.com/y-l-g/tablo.git", rev = "259959397" }
topcoat = { version = "0.12", features = ["icon-iconify"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Tablo's traits fix these signatures and names; the rest of pedantic earns its keep.
doc_markdown = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unused_async = "allow"
unused_async_trait_impl = "allow"

[profile.release]
codegen-units = 4
lto = "thin"
strip = "debuginfo"

